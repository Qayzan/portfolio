<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Fauzan Fauzy</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/portfolio/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #131209; --ink: #F2EFE8; --muted: #9B9B9B; --accent: #FF5A1F; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-content: center; text-align: center; padding: 24px; background: var(--bg); color: var(--ink); font: 400 16px/24px "Geist", system-ui, sans-serif; }
    .code { font: 500 12px/16px "Geist Mono", monospace; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin: 0 0 16px; }
    h1 { margin: 0 0 16px; font-weight: 600; font-size: 60px; line-height: 1; letter-spacing: -0.03em; background: linear-gradient(90deg, #FFFFFF, #9B9B9B); -webkit-background-clip: text; background-clip: text; color: transparent; }
    p { color: var(--muted); margin: 0 0 24px; }
    a { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--ink); color: #000; font-weight: 600; text-decoration: none; transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1); }
    a:hover { transform: translateY(-2px); }
    a:active { transform: scale(0.98); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    @media (max-width: 768px) { h1 { font-size: 36px; line-height: 40px; } }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>This level doesn’t exist.</h1>
    <p>The page may have moved, or a bug ate it. The rest of the site is still here.</p>
    <a href="/portfolio/">Back to the portfolio <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
